services:
  db:
    image: postgres:16-alpine
    container_name: training_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
    - training_network

  web:
    image: bobgoze/training_word
    container_name: training_web
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped
    networks:
    - training_network

  gateway:
    image: bobgoze/gateway
    container_name: gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - media:/media:ro
      - static:/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
    - training_network

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    container_name: redis
    networks:
    - training_network


networks:
  training_network:
    driver: bridge


volumes:
  postgres_data:
  media:
  static:
  redis_data:
