services:
  db:
    image: postgres:16-alpine
    container_name: training_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
    - training_network


  web:
    image: bobgoze/training_word
    container_name: training_web
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped
    networks:
    - training_network

  gateway:
    image: bobgoze/gateway
    container_name: gateway
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - media:/media:ro
      - static:/static:ro
    restart: unless-stopped
    networks:
    - training_network

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    restart: unless-stopped
    container_name: redis
    networks:
    - training_network

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: backup_data
    restart: unless-stopped
    volumes:
        - /var/opt/pgbackups:/backups
    environment:
        - POSTGRES_HOST=${DB_HOST}
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        # Параметры бекапа
        - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
        - SCHEDULE=@daily
        - BACKUP_ON_START=TRUE
        - BACKUP_KEEP_DAYS=7
        - HEALTHCHECK_PORT=8080
        - TZ=Europe/Moscow
        - BACKUP_KEEP_WEEKS=4
        - BACKUP_KEEP_MONTHS=6
    networks:
    - training_network

networks:
  training_network:
    driver: bridge


volumes:
  postgres_data:
  media:
  static:
  redis_data:
