{% extends "base.html" %}

{% block content %}
  <a href="{% url "index" %}" class="text-link">На главную</a>

<div class="container">
  <form method="post">
    {% csrf_token %}
    <p>
      Слово: {{ form.word }}
    </p>
    <p>
      Определение: {{ form.definition }}
    </p>
    <p>
      Активное ли: {{ form.is_active }}
    </p>
    <button type="submit">Сохранить</button>
  </form>
{% endblock content %}
