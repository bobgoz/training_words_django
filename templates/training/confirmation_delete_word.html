{% extends "base.html" %}

{% block content %}
  <form action="{% url "delete_word" pk_word=word.pk %}" method="post">
    {% csrf_token %}
    <p>
      Подтверждаете удаление слова {{ word.word }}?
    </p>
    <button type="submit">Да</button>
    <a href="{% url "detail" pk_word=word.pk %}">Назад</a>
  </form>

{% endblock content %}
