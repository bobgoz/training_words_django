<!-- users/profile_base.html -->
{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
  <div class="container mt-4">
    <div class="row">
      <!-- Левое меню (sidebar) -->
      <div class="col-md-3 mb-4">
        <div class="list-group">
          <a
            href="{% url 'profile' %}"
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'profile_info' %}active{% endif %}"
          >
            👤 Информация
          </a>
          <a
            href=""
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'profile_stats' %}active{% endif %}"
          >
            📊 Статистика
          </a>
          <a
            href=""
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'profile_plan' %}active{% endif %}"
          >
            📅 План
          </a>
          <a
            href="{% url 'profile_edit' %}"
            class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'profile_edit' %}active{% endif %}"
          >
            ✏️ Редактировать
          </a>
        </div>
        <div></div>
      </div>

      <!-- Правый контент -->
      <div class="col-md-9">
        <div class="card">
          <div class="card-body">
            {% block profile_content %} {% endblock %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
