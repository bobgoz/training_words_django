{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row g-4">
        <!-- Левая колонка: меню -->
        <div class="col-md-3">
            <div class="list-group shadow-sm">
                <a href="{% url 'profile_info' %}" 
                   class="list-group-item list-group-item-action d-flex align-items-center gap-3 {% if request.resolver_match.url_name == 'profile_info' %}active{% endif %}">
                    <span class="fs-5">👤</span>
                    <span>Информация</span>
                </a>
                <a href="" 
                   class="list-group-item list-group-item-action d-flex align-items-center gap-3 {% if request.resolver_match.url_name == 'profile_stats' %}active{% endif %}">
                    <span class="fs-5">📊</span>
                    <span>Статистика</span>
                </a>
                <a href="" 
                   class="list-group-item list-group-item-action d-flex align-items-center gap-3 {% if request.resolver_match.url_name == 'profile_plan' %}active{% endif %}">
                    <span class="fs-5">📅</span>
                    <span>План</span>
                </a>
                <a href="{% url 'profile_edit' %}" 
                   class="list-group-item list-group-item-action d-flex align-items-center gap-3 {% if request.resolver_match.url_name == 'profile_edit' %}active{% endif %}">
                    <span class="fs-5">✏️</span>
                    <span>Редактировать</span>
                </a>
            </div>
        </div>

        <!-- Правая колонка: контент -->
        <div class="col-md-9">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    {% block profile_content %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
