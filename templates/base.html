<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Тренажёр слов{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div style="
                    padding: 10px;
                    margin-bottom: 10px;
                    border-radius: 4px;
                    {% if message.tags == 'success' %}
                        background-color: #d4edda;
                        color: #155724;
                    {% elif message.tags == 'error' %}
                        background-color: #f8d7da;
                        color: #721c24;
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
