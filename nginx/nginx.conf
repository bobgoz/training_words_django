server {
    listen 80;
    server_name training-word.duckdns.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name training-word.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/training-word.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training-word.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout   70;

    location / {
        proxy_pass https://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        alias /media/;
    }

    location /static/ {
        alias /static/;
    }
}
