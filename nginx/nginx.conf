proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=django_cache:10m max_size=1g inactive=60m;

server {
    listen 80;
    server_name training-word.duckdns.org;
    client_max_body_size 20M;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name training-word.duckdns.org;
    client_max_body_size 20M;

    proxy_cache django_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_min_uses 1;

    proxy_cache_valid 200 302 60m;
    proxy_cache_valid 404 1m;
    proxy_cache_valid any 5m;

    add_header X-Cache-Status $upstream_cache_status;

    ssl_certificate     /etc/letsencrypt/live/training-word.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training-word.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout   70;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public, immutable";

    }

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";

    }
}
