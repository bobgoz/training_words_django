services:
  db:
    image: postgres:16-alpine
    container_name: db
    env_file:
      - src/training_words_django/.env
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/training_words_django/Dockerfile
    container_name: django_web
    env_file:
      - src/training_words_django/.env
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped

  gateway:
    build: ./nginx_dev
    container_name: gateway
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - media:/media:ro
      - static:/static:ro
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  media:
  static:
  redis_data:
