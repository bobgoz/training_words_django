services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build: .
    container_name: web
    env_file:
      - .env
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped

  gateway:
    build: ./nginx
    container_name: gateway
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - media:/media:ro
      - static:/static:ro
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery:
    build: .
    command: celery -A training_words.celery_app worker -l info
    depends_on:
      - redis
      - db
      - web
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
      - CELERY_RESULT_BACKEND=${REDIS_URL}
    volumes:
      - .:/app

volumes:
  postgres_data:
  media:
  static:
  redis_data:
