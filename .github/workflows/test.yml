name: test

on:
  schedule:
    - cron: '0 2 * * *'  
  workflow_dispatch:        

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Copy from remote with action
        run: |
          mkdir -p ./backup
          scp ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/root/opt/training/backups/* ./backup




      
