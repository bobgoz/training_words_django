name: Backup

on:
  schedule:
    - cron: '0 2 * * *'  
  workflow_dispatch:        

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mailutils

      - name: Set backup date
        run: echo "BACKUP_DATE=$(date +%m-%d-%Y_%H-%M-%S)" >> $GITHUB_ENV


      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |

            DATE=${{ env.BACKUP_DATE }}
            BACKUP_DIR="/root/opt/training/backups"
            
            mkdir -p $BACKUP_DIR/$DATE

            echo "Starting backup at $DATE to $BACKUP_DIR/$DATE"
            
            # Бэкап PostgreSQL
            echo "Creating PostgreSQL backup..."
            docker exec training_db pg_dump -U bobrov -d training | gzip > $BACKUP_DIR/$DATE/pg_data.sql.gz
            
            # Бэкап media volume
            echo "Creating media volume backup..."
            docker run --rm \
              -v training_media:/source:ro \
              -v $BACKUP_DIR/$DATE:/backup \
              alpine tar czf /backup/media.tar.gz -C /source .
            
            # Бэкап static volume
            echo "Creating static volume backup..."
            docker run --rm \
              -v training_static:/source:ro \
              -v $BACKUP_DIR/$DATE:/backup \
              alpine tar czf /backup/static.tar.gz -C /source .
            
            echo "Бэкап создан: $BACKUP_DIR"

      - name: Download backups - FIX with variables
        run: |
            mkdir -p ./backups
            
            echo "${{ secrets.SSH_KEY }}" > /tmp/ssh_key
            chmod 600 /tmp/ssh_key
            
            # Задаем переменные
            SSH_USER="${{ secrets.USERNAME }}"
            SSH_HOST="${{ secrets.HOST }}"
            REMOTE_PATH="/root/opt/training/backups"
            
            echo "Downloading from ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"
            
            # Выполняем через переменные
            ssh -i /tmp/ssh_key \
                -o StrictHostKeyChecking=no \
                "${SSH_USER}@${SSH_HOST}" \
                "cd ${REMOTE_PATH} && tar czf - ." > ./backups/backups.tar.gz
            
            ls -lh ./backups/backups.tar.gz
            
            cd ./backups
            tar xzf backups.tar.gz
            rm backups.tar.gz
            
            echo "✅ Downloaded:"
            find . -type f -exec ls -lh {} \;
            
            rm -f /tmp/ssh_key
          
      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ env.BACKUP_DATE }}
          path: ./backups/*
          retention-days: 30

      - name: Create backup archive for email
        run: |
          cd ./backups
          tar czf ../backup_${{ env.BACKUP_DATE }}.tar.gz .
          cd ..
          echo "Archive created:"
          ls -lh backup_${{ env.BACKUP_DATE }}.tar.gz

      - name: Send email with backup attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ✅ Бэкап от ${{ env.BACKUP_DATE }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Бекап Docker volumes успешно создан!
          
          📅 Дата: ${{ env.BACKUP_DATE }}
          📦 Размер: $(ls -lh backup_${{ env.BACKUP_DATE }}.tar.gz | awk '{print $5}')
          
            Архив прикреплен к письму.
          attachments: backup_${{ env.BACKUP_DATE }}.tar.gz

      - name: Clean old backups on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -r /root/opt/training/backups/*

