name: Backup

on:
  schedule:
    - cron: '0 2 * * *'  
  workflow_dispatch:        

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mailutils

      - name: Set backup date
        run: echo "BACKUP_DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |

            DATE=${{ env.BACKUP_DATE }}
            BACKUP_DIR="opt/training/backups"
            mkdir -p $BACKUP_DIR
            
            # Бэкап PostgreSQL
            docker exec training_db pg_dump -U bobrov -d training | gzip > $BACKUP_DIR/db_$DATE.sql.gz
            
            # Бэкап media volume
            docker run --rm -v training_words_django_media:/source:ro -v $BACKUP_DIR:/backup alpine \
              tar czf /backup/media_$DATE.tar.gz -C /source .
            
            # Бэкап static volume
            docker run --rm -v training_words_django_static:/source:ro -v $BACKUP_DIR:/backup alpine \
              tar czf /backup/static_$DATE.tar.gz -C /source .
            
            echo "Бэкап создан: $BACKUP_DIR"

      - name: Download backups
        run: |
          mkdir -p ./backups
          scp -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/training/backups/*.tar.gz ./backups/
          scp -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/training/backups/*.sql.gz ./backups/

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ env.BACKUP_DATE }}
          path: ./backups/*
          retention-days: 30

      - name: Send email with backup
        uses: dawidd6/action-send-mail@master
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ✅ Бэкап томов от ${{ env.BACKUP_DATE }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Привет!
            
            Бэкап Docker volumes успешно создан.
            
            Дата: ${{ env.BACKUP_DATE }}
            Размеры файлов:
            $(du -sh ./backups/*.tar.gz ./backups/*.sql.gz)
            
            Файлы прикреплены к письму.
            
            ---
            GitHub Actions
          attachments: ./backups/*.tar.gz, ./backups/*.sql.gz

      - name: Clean old backups on server
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "find /opt/training/backups -name '*.tar.gz' -mtime +30 -delete && \
             find /opt/training/backups -name '*.sql.gz' -mtime +30 -delete"

