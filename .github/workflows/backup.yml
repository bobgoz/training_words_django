name: Backup

on:
  schedule:
    - cron: '0 2 * * *'  
  workflow_dispatch:        

jobs:
  backup:
    runs-on: ubuntu-latest 

    steps:
      - name: Set backup date
        run: echo "BACKUP_DATE=$(date +%m-%d-%Y_%H-%M-%S)" >> $GITHUB_ENV

      - name: Execute remote SSH commands (Create Backup)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            DATE=${{ env.BACKUP_DATE }}
            BACKUP_DIR="/root/opt/training/backups"
            
            mkdir -p $BACKUP_DIR/$DATE

            echo "Starting backup at $DATE to $BACKUP_DIR/$DATE"
            
            # Бэкап PostgreSQL
            echo "Creating PostgreSQL backup..."
            # Важно: убедитесь, что пользователь bobrov имеет права, или используйте postgres
            docker exec training_db pg_dump -U bobrov -d training | gzip > $BACKUP_DIR/$DATE/pg_data.sql.gz
            
            # Бэкап media volume
            echo "Creating media volume backup..."
            docker run --rm \
              -v training_media:/source:ro \
              -v $BACKUP_DIR/$DATE:/backup \
              alpine tar czf /backup/media.tar.gz -C /source .
            
            # Бэкап static volume
            echo "Creating static volume backup..."
            docker run --rm \
              -v training_static:/source:ro \
              -v $BACKUP_DIR/$DATE:/backup \
              alpine tar czf /backup/static.tar.gz -C /source .
            
            echo "Backup created successfully in $BACKUP_DIR/$DATE"

      - name: Download backups from server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "/root/opt/training/backups/${{ env.BACKUP_DATE }}"
          target: "./backups"
          strip_components: 3 # Убирает лишние уровни вложенности, чтобы папка легла корректно
          overwrite: true

      - name: Verify downloaded files
        run: |
          echo "Files downloaded:"
          ls -R ./backups
          
          # Проверка, что файлы не пустые
          if [ ! -s "./backups/${{ env.BACKUP_DATE }}/pg_data.sql.gz" ]; then
            echo "Error: DB backup is empty!"
            exit 1
          fi

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4 # Обновил до v4, так как v7 может быть нестабилен или еще не релизнут стабильно для всех
        with:
          name: backup-${{ env.BACKUP_DATE }}
          path: ./backups/${{ env.BACKUP_DATE }}
          retention-days: 30

      - name: Create backup archive for email
        run: |
          cd ./backups/${{ env.BACKUP_DATE }}
          tar czf ../../backup_${{ env.BACKUP_DATE }}.tar.gz .
          cd ../..
          echo "Archive created:"
          ls -lh backup_${{ env.BACKUP_DATE }}.tar.gz

      - name: Send email with backup attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ✅ Бэкап от ${{ env.BACKUP_DATE }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Бекап Docker volumes успешно создан!
          
            📅 Дата: ${{ env.BACKUP_DATE }}
            📦 Размер: $(ls -lh backup_${{ env.BACKUP_DATE }}.tar.gz | awk '{print $5}')
          
            Архив прикреплен к письму.
          attachments: backup_${{ env.BACKUP_DATE }}.tar.gz

      - name: Clean OLD backups on server (Keep last 7 days)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            BACKUP_DIR="/root/opt/training/backups"
            echo "Cleaning old backups in $BACKUP_DIR, keeping only last 7 days..."
            # Удаляем директории старше 7 дней
            find $BACKUP_DIR -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
            echo "Cleanup finished."
