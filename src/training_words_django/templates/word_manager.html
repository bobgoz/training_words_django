{% extends "base.html" %}

{% block title %}Менеджер слов{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-md-3 mt-3">
      <div class="btn-group-vertical" role="group" aria-label="group">
        <a
          class="btn btn-outline-primary {% if request.resolver_match.url_name == 'active_words' %}active{% endif %}"
          href="{% url 'active_words' %}"
        >Активные слова</a>
        <a
          class="btn btn-outline-primary {% if request.resolver_match.url_name == 'inactive_words' %}active{% endif %}"
          href="{% url 'inactive_words' %}"
        >Новые слова</a>
        <a
          class="btn btn-outline-primary {% if request.resolver_match.url_name == 'learned_words' %}active{% endif %}"
          href="{% url 'learned_words' %}"
        >Выученные слова</a>
      </div>
    </div>
    <div class="col-md-8 mt-3">
      <div>
        {% block items_content %}{% endblock items_content %}
      </div>
    </div>
  </div>
{% endblock %}
